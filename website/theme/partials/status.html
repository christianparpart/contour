<div class="status" id="cw-status">
  <span class="mode" id="cw-mode">NORMAL</span>
  <span class="loc" id="cw-loc">{% if page and shown.active %}{{ shown.ws.title }} › <b>{{ page.title }}</b>{% endif %}</span>
  <span class="flash" id="cw-flash" role="status"></span>
  <span class="grow"></span>
  <span class="needs-js" id="cw-hints"></span>
  <button class="needs-js" id="cw-outline-toggle" title="Show the page outline">≡ outline</button>
  <button class="needs-js" id="cw-theme" title="Toggle light/dark">◐ theme</button>
  <span id="cw-clock"></span>
</div>
