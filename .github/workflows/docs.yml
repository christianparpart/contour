name: Docs

on:
  merge_group:
  # Redeploying the docs is sometimes necessary after a commit that touches no documentation at all:
  # this job builds `contour` to generate half the site, so anything that breaks or fixes the build
  # decides whether the site can be published, while the paths filter below -- rightly -- does not
  # fire for it. That is not hypothetical; it is exactly the situation this was added in, with the
  # last run red from a compile error whose fix touched only src/net. Re-running the old run is no
  # answer either, since it replays the commit that failed. Without a manual trigger the only way to
  # redeploy was to invent a commit under docs/.
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'metainfo.xml'
      - 'website/**'
      - 'mkdocs.yml'
      - 'src/contour/config/ConfigDocumentation.hpp'
    branches:
      - master
  # Pull requests build and check the site but never deploy it.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'metainfo.xml'
      - 'website/**'
      - 'mkdocs.yml'
      - 'src/contour/config/ConfigDocumentation.hpp'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site tooling's own tests, in a job of their own: they need no C++ build, so a failure shows within
  # a minute, and the build and deploy below wait for it rather than spending half an hour first.
  tests:
    name: Website tooling tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # Node comes with the ubuntu-24.04 runner image, so no setup-node step is needed.
      - name: "Run the unit tests"
        env:
          # mkdocs 1.6.1 prints a loud MkDocs-2.0 warning otherwise.
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          pip install -r docs/requirements.txt
          python -m unittest discover -s website/tools
          node --test website/tests/*.test.js

  mkdocs:
    name: Build, check and deploy docs
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: "Install GCC"
        # gcc-14 as well as g++-14: the compiler is named explicitly at configure time below, so the
        # C driver has to exist under that name too (g++-14 does depend on it, but the build should
        # not lean on a transitive dependency for a tool it invokes by name).
        run: sudo apt -y install gcc-14 g++-14
      - name: "install dependencies"
        # CONTOUR_EXTENSIONS_BUNDLED=OFF: no Rust for the bundled extensions, which this job builds without.
        run: sudo env QTVER=6 SYSDEP_ASSUME_YES=ON CONTOUR_EXTENSIONS_BUNDLED=OFF ./scripts/install-deps.sh
      - name: "Post-fix embedded dependency permissions."
        run: sudo find _deps/sources -exec chown $UID {} \;
      - name: "create build directory"
        run: mkdir build
      # Every `contour documentation ...` verb below is registered by ContourApp and reads only
      # Qt-free sources (vtbackend's function table, contour::actions, contour::config), so docs
      # generation has no use for the GUI frontend -- and building it here is what broke this
      # workflow: Ubuntu 24.04's distro Qt is 6.4.2, whose Qt6::QmlPrivate names an include path it
      # does not ship, which fails the configure step outright. The build matrix works around that
      # by installing a modern Qt over the distro one; this job needs no Qt at all, so it opts out
      # instead. CMAKE_DISABLE_FIND_PACKAGE_Qt6 makes every find_package(Qt6 ...) fail, so the build
      # cannot merely happen to pick up whichever Qt is lying around -- same assertion as the
      # "Ubuntu Linux (contour-daemon package, ...)" job in build.yml.
      #
      # CONTOUR_EXTENSIONS_BUNDLED=OFF for the same reason: the bundled status-line extensions are Rust,
      # nothing the documentation verbs print comes from them, and building them would take a Rust
      # toolchain this job has no use for.
      #
      # The compiler is named rather than left to the default: this job installs g++-14, but that
      # does not make it the default -- Ubuntu 24.04's `g++` is 13.3, whose libstdc++ has no
      # std::ranges::to (C++23, and GCC 14 is where it arrived), so vtbackend/core/Color.cpp fails with
      # "'to' is not a member of 'std::ranges'". This job takes the gcc-debug preset's
      # PEDANTIC_COMPILER_WERROR=ON, which the build matrix passes OFF, so it is the strictest GCC
      # build in the tree and the only one that has to be told which GCC to be.
      - name: "Install-contour"
        run: |
          cmake --preset gcc-debug \
                -B build \
                -G Ninja \
                -D CMAKE_C_COMPILER=gcc-14 \
                -D CMAKE_CXX_COMPILER=g++-14 \
                -D CONTOUR_WAYLAND=OFF \
                -D CONTOUR_FRONTEND_GUI=OFF \
                -D CONTOUR_EXTENSIONS_BUNDLED=OFF \
                -D CMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
      - name: "build"
        run: cmake --build build --target contour
      # Generates the configuration, profile, vt-sequence and key-mapping references, and extracts
      # the release notes from metainfo.xml.
      - name: "Generate the reference pages"
        run: ./website/tools/generate-reference.sh ./build/src/contour/contour

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: "Build and check the site"
        env:
          # mkdocs 1.6.1 prints a loud MkDocs-2.0 warning otherwise.
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
          python website/tools/check_site.py

      # Publish the tree that was just built and checked, not a rebuild of it. site/CNAME comes from
      # docs/CNAME, which must stay contour-terminal.org -- the domain the live gh-pages branch
      # serves; check_site.py fails the build otherwise. Only master deploys: pull requests, merge
      # groups and manual runs of other branches stop before this.
      - name: "Deploy docs"
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --no-history site
